org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Gradle 需要 JVM 17+，系统 JAVA_HOME 指向 jre-8，这里显式指定
org.gradle.java.home=D:\\dev\\jdk17
android.useAndroidX=true
# 项目路径含中文（D:\短剧APP），关掉 Gradle 的非 ASCII 路径检查
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# #73 构建阻塞（Observed）：Kotlin 2.4 btapi + Gradle 9.3.1 + Windows 下，
# :flutter_volume_controller:compileDebugKotlin 每次死在
# "Could not close incremental caches ... class-fq-name-to-source.tab"，
# 清 build 目录与停 daemon 均无效 ⇒ 关闭增量编译（代价：全量编译，秒级差异）
kotlin.incremental=false

# media_kit_libs_android_video 要从 GitHub Releases 下 libmpv jar（build.gradle:83），
# 直连超时。本地 127.0.0.1:7890 可用（已测 200）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.aliyuncs.com
